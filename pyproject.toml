[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["assets/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RET"]
ignore = ["E402", "RET504", "RET505", "SIM102", "SIM103", "SIM108"]

[tool.pyright]
include = ["source", "scripts"]
exclude = ["**/__pycache__", "**/*.egg-info", "assets/generated"]
typeCheckingMode = "off"
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportMissingImports = "none"
reportMissingModuleSource = "none"
